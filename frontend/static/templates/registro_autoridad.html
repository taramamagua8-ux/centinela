<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de autoridad | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/institucional.css">
    <script src="../js/institucional.js" defer></script>
</head>
<body class="pagina-institucional pagina-acceso pagina-registro-institucional" data-pagina="registro_autoridad">

    <div class="barra-volver">
        <a href="acceso_autoridad.html" class="btn-volver">← Volver</a>
    </div>

    <main class="institucional">
        <img class="logo-acceso" src="../img/centinela_Completo.png" alt="Centinela Digital">
        <h1>Registro de autoridad</h1>
        <p class="subtitulo-acceso">Completa tus datos para solicitar una cuenta institucional.</p>
        <p id="aviso-institucional" role="status" aria-live="polite"></p>
        <form id="registro-autoridad" class="panel-institucional formulario-institucional">
            <label>Nombre completo <input name="nombre" maxlength="150" autocomplete="name" required></label>
            <label>Correo electrónico <input type="email" name="correo" maxlength="150" autocomplete="username" required></label>
            <label>Contraseña <input type="password" name="contrasena" minlength="12" maxlength="128" autocomplete="new-password" required></label>
            <label>Institución o escuela <input name="institucion" maxlength="150" required></label>
            <label>Cargo <input name="cargo" maxlength="150" required></label>
            <label>Tipo de autoridad
                <select name="tipo_autoridad" required>
                    <option value="">Selecciona un tipo</option>
                    <option value="orientador">Orientador escolar</option>
                    <option value="especialista">Representante institucional por tipo de violencia</option>
                </select>
            </label>
            <label id="campo-tipo-violencia" hidden>Tipo de violencia
                <select name="id_tipo_violencia"><option value="">Selecciona un tipo</option></select>
            </label>
            <label>Nombramiento o carta oficial de la escuela o institución (PDF, hasta 5 MB)
                <input type="file" name="comprobante" accept=".pdf,application/pdf" required>
            </label>
            <p>Adjunta un documento que acredite tu cargo o autorización para representar a la institución. El acceso queda en revisión hasta que se valide.</p>
            <button>Enviar solicitud</button>
            <a href="acceso_autoridad.html">Ir al inicio de sesión</a>
        </form>
    </main>
</body>
</html>
