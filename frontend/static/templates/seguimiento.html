<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Seguimiento de reporte | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="pagina-folio pagina-detalle-reporte">
    <main class="pagina-seguimiento">
        <header class="encabezado-seguimiento">
            <a class="btn-volver" href="principal.html">← Inicio</a>
            <h1 class="titulo-seguimiento">Seguimiento de reporte</h1>
        </header>

        <p class="tarjeta-seguimiento aviso-detalle-reporte" id="aviso-seguimiento" role="status">Consultando reporte…</p>

        <div id="contenido-seguimiento" hidden>
            <section class="tarjeta-seguimiento tarjeta-resumen-reporte" aria-labelledby="titulo-resumen">
                <div class="cabecera-resumen-reporte">
                    <img src="../img/Copia de LEO.jpg" alt="" class="logo-seguimiento">
                    <div>
                        <h2 id="titulo-resumen">Folio de seguimiento</h2>
                        <p id="folio-reporte" class="folio-resumen-reporte"></p>
                        <p id="fecha-registro-reporte" class="fecha-resumen-reporte"></p>
                    </div>
                </div>
                <dl class="indicadores-reporte">
                    <div>
                        <dt>Estatus</dt>
                        <dd id="estatus-reporte"></dd>
                    </div>
                    <div>
                        <dt>Nivel de riesgo</dt>
                        <dd id="riesgo-reporte"></dd>
                    </div>
                </dl>
            </section>

            <section class="panel-detalle-reporte" id="panel-detalle-reporte" hidden>
                <h2>Información del reporte</h2>
                <dl id="detalle-seguimiento" class="datos-detalle-reporte"></dl>
            </section>

            <section class="panel-detalle-reporte" id="orientacion-reporte">
                <h2>Orientación institucional</h2>
                <div id="respuesta-institucion"></div>
                <a class="enlace-directorio-reporte" id="directorio-reporte" href="directorio.html">Consultar el directorio de instituciones <span aria-hidden="true">→</span></a>
            </section>
        </div>

        <footer class="pie-detalle-reporte">
            <a class="btn-volver" href="formulario.html">Consultar otro folio <span aria-hidden="true">→</span></a>
        </footer>
    </main>
    <script src="../js/detalle_reporte.js"></script>
</body>
</html>
