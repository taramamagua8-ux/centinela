<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de institución | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/detalle_institucion.js" defer></script>
    <style>
        .ruta { margin: 0; color: #923b61; font-size: 13px; font-weight: 600; }
        .bloque-detalle { width: 100%; padding: 26px 30px; box-sizing: border-box; text-align: left; }
        .bloque-detalle h2 { margin: 0 0 10px; color: #923b61; font-size: 18px; }
        .bloque-detalle p, .bloque-detalle li { margin: 6px 0; color: #665d67; line-height: 1.6; }
        .bloque-detalle ul { margin: 0; padding-left: 20px; }
        .volver { width: max-content; margin: 0; }
        .hero-detalle { justify-content: flex-start; }
        .imagen-detalle { display: grid; flex: 0 0 auto; width: 160px; height: 160px; place-items: center; overflow: hidden; border-radius: 16px; background: rgba(255, 255, 255, 0.92); }
        .imagen-detalle img { width: 100%; height: 100%; object-fit: contain; }
        @media (max-width: 600px) {
            .hero-detalle { flex-direction: column; align-items: flex-start; }
            .imagen-detalle { width: 100%; height: 170px; }
        }
    </style>
</head>

<body class="pagina-inicio">

    <header class="barra-superior">
        <input type="checkbox" id="menu-toggle" class="toggle-menu">
        <label for="menu-toggle" class="btn-hamburguesa">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav class="menu-lateral">
            <a href="principal.html">Inicio</a>
            <a href="descubre_mas.html">Descubre más</a>
            <a href="videos.html">Videos</a>
            <a href="directorio.html">Directorio</a>
            <a href="sobre_nosotros.html">Sobre nosotros</a>
        </nav>

        <div class="logo-centro">
            <img src="../img/centinela_digital.png" alt="Logo Centinela Digital">
            <span>CENTINELA DIGITAL</span>
        </div>

        <div class="iconos-derecha">
            <a class="btn-icono" href="cuenta.html">Cuenta</a>
        </div>
    </header>

    <main class="contenido-inicio">

        <p class="ruta">Inicio › Directorio › Información de institución</p>

        <section class="bloque-cta hero-detalle">
            <div class="imagen-detalle">
                <img id="imagenInstitucion" alt="Imagen de la institución">
            </div>
            <div>
                <h1 class="titulo-inicio" id="nombreInstitucion">Nombre de la institución</h1>
                <p class="descripcion-inicio" id="resumenInstitucion"></p>
                <p class="descripcion-inicio" id="ubicacionInstitucion"></p>
            </div>
        </section>

        <section class="cuenta-panel bloque-detalle">
            <h2>Descripción</h2>
            <p id="descripcionInstitucion"></p>
        </section>

        <section class="cuenta-panel bloque-detalle">
            <h2>Servicios y áreas de atención</h2>
            <ul id="serviciosInstitucion"></ul>
        </section>

        <section class="cuenta-panel bloque-detalle">
            <h2>Contacto</h2>
            <p><strong>Teléfono:</strong> <span id="telefonoInstitucion"></span></p>
            <p><strong>Horario:</strong> <span id="horarioInstitucion"></span></p>
            <p><strong>Sitio oficial:</strong> <span id="sitioInstitucion"></span></p>
        </section>

        <a href="resultados_busqued.html" class="boton-cuenta volver">Volver al directorio</a>

    </main>

    <script>
        const imagenInstitucion = document.getElementById('imagenInstitucion');
        const idInstitucion = new URLSearchParams(location.search).get('id');
        imagenInstitucion.onerror = function () { imagenInstitucion.remove(); };
        if (idInstitucion) {
            imagenInstitucion.src = '../img/' + idInstitucion + '.png';
        } else {
            imagenInstitucion.remove();
        }
    </script>

</body>
</html>
