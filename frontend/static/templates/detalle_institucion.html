<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de institución | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/catalogo_instituciones.js" defer></script>
    <script src="../js/detalle_institucion.js" defer></script>
    <link rel="stylesheet" href="../css/paginas.css">
    <link rel="stylesheet" href="../css/detalle.css">
</head>
<body class="pagina-resultados pagina-app">
    <script src="../js/navbar.js"></script>

    <main class="contenido-pagina">
    <main class="contenido-pagina">

        <p class="ruta"><a href="principal.html">Inicio</a> › <a href="directorio.html">Directorio</a> › Información de institución</p>

        <section class="hero hero-detalle">
            <div class="imagen-detalle">
                <img id="imagenInstitucion" alt="Imagen de la institución">
            </div>
            <div>
                <h1 id="nombreInstitucion">Nombre de la institución</h1>
                <p id="resumenInstitucion"></p>
                <p id="ubicacionInstitucion"></p>
            </div>
        </section>

        <section class="tarjeta bloque-detalle">
            <h2>Descripción</h2>
            <p id="descripcionInstitucion"></p>
        </section>

        <section class="tarjeta bloque-detalle">
            <h2>Servicios y áreas de atención</h2>
            <ul id="serviciosInstitucion"></ul>
        </section>

        <section class="tarjeta bloque-detalle">
            <h2>Contacto</h2>
            <p><strong>Teléfono:</strong> <span id="telefonoInstitucion"></span></p>
            <p><strong>Horario:</strong> <span id="horarioInstitucion"></span></p>
            <p><strong>Sitio oficial:</strong> <span id="sitioInstitucion"></span></p>

            <p id="filaCorreo" hidden><strong>Correo:</strong> <span id="correoInstitucion"></span></p>
        </section>

        <a href="directorio.html" class="boton volver">Volver al directorio</a>

    </main>

    <script>
        const respaldo = "data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%27-4 -4 32 32%27 fill=%27none%27 stroke=%27%23c56ed3%27 stroke-width=%271.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 21h18M5 21V7l7-4 7 4v14M9 9h2M13 9h2M9 13h2M13 13h2M10 21v-4h4v4%27/%3E%3C/svg%3E";
        const imagenInstitucion = document.getElementById('imagenInstitucion');
        const idInstitucion = new URLSearchParams(location.search).get('id');
        imagenInstitucion.onerror = function () { imagenInstitucion.onerror = null; imagenInstitucion.src = respaldo; };
        imagenInstitucion.src = idInstitucion ? '../img/' + idInstitucion + '.png' : respaldo;
    </script>

</body>
</html>
