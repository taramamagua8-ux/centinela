<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Formulario de reporte | Centinela Digital</title>
    <link rel="stylesheet" href="../css/reporte.css">
</head>
<body>
    <main class="container">
        <header class="header"><h1>Formulario de reporte</h1></header>
        <section class="form-card flujo-reporte">
            <form id="formularioReporte">
                <fieldset class="selecciones-reporte">
                    <legend>¿Cómo quieres continuar con tu reporte?</legend>
                    <label><input type="radio" name="rol" value="victima" required><span>Víctima</span></label>
                    <label><input type="radio" name="rol" value="testigo" required><span>Testigo</span></label>
                </fieldset>
                <fieldset class="selecciones-reporte">
                    <legend>¿De qué manera quieres reportar?</legend>
                    <label><input type="radio" name="modalidad" value="anonima" required><span>Anónima</span></label>
                    <label><input type="radio" name="modalidad" value="registrada" required><span>Registrado</span></label>
                </fieldset>
                <div class="acciones-reporte">
                    <a href="principal.html">Volver al inicio</a>
                    <button class="btn-formulario" type="submit">Continuar</button>
                </div>
                <p id="aviso-seleccion-reporte" role="alert"></p>
            </form>
        </section>
    </main>
    <script src="../js/formulario_reporte.js"></script>
</body>
</html>
