<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Formulario de reporte | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="pagina-folio pagina-formulario-reporte">
    <main class="pagina-seguimiento">

        <header class="encabezado-seguimiento">
            <a class="btn-volver" href="principal.html">← Inicio</a>
            <h1 class="titulo-seguimiento">Formulario de reporte</h1>
        </header>

        <section class="tarjeta-seguimiento flujo-reporte">
            <div class="marca-folio">
                <img src="../img/Copia de LEO.jpg" alt="Centinela Digital" class="logo-seguimiento">
            </div>

            <form id="formularioReporte">
                <fieldset class="selecciones-reporte">
                    <legend>¿Cómo quieres continuar con tu reporte?</legend>
                    <label><input type="radio" name="rol" value="victima" required><span>Víctima</span></label>
                    <label><input type="radio" name="rol" value="testigo" required><span>Testigo</span></label>
                </fieldset>

                <fieldset class="selecciones-reporte">
                    <legend>¿De qué manera quieres reportar?</legend>
                    <label><input type="radio" name="modalidad" value="anonima" required><span>Anónima</span></label>
                    <label><input type="radio" name="modalidad" value="registrada" required><span>Registrado</span></label>
                </fieldset>

                <div class="botones-seguimiento acciones-reporte">
                    <button class="btn-principal" type="submit">Continuar <span aria-hidden="true">→</span></button>
                </div>

                <p id="aviso-seleccion-reporte" role="alert"></p>
            </form>
        </section>

    </main>
    <script src="../js/formulario_reporte.js"></script>
</body>
</html>
