<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Comencemos tu reporte</title>

    <link rel="stylesheet" href="../css/reporte.css">

</head>
<body>

    <h1>Comencemos tu reporte</h1>

    <p>
        Antes de continuar es importante que conozcas la información relacionada
        con tu reporte.
    </p>

    <p>
        Te recomendamos leer los terminos y condiciones antes de continuar.
    </p>

    <button type="button" onclick="abrirTerminos()">
        Leer términos y condiciones
    </button>

    <br><br>

    <input type="checkbox" id="aceptar">

    <label for="aceptar">

        Estoy consciente de que la información proporcionada sera utilizada
        para generar un reporte dentro de Centinela Digital.

    </label>

    <br><br>

    <button onclick="volverPagina()">

        Volver

    </button>

    <button onclick="continuarReporte()">

        Continuar

    </button>

    <script src="../js/comencemos_reporte.js"></script>

</body>
</html>
