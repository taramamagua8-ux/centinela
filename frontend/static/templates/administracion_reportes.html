<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canalización | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/institucional.css">
    <script src="../js/institucional.js" defer></script>
</head>
<body class="pagina-institucional pagina-panel" data-pagina="administracion_reportes">
    <script src="../js/navbar.js"></script>

    <main class="institucional">
        <h1>Canalización</h1>
        <p id="aviso-institucional" role="status" aria-live="polite"></p>

        <div class="acciones-panel">
            <a class="boton-panel" href="expedientes.html">Gestionar expedientes, actividades e informes</a>
            <button id="cerrar-sesion" class="boton-secundario" type="button">Cerrar sesión</button>
        </div>

        <details class="panel-institucional">
            <summary>Administradores</summary>
            <form id="nuevo-admin" class="formulario-institucional">
                <label>Nombre completo <input name="nombre" maxlength="150" autocomplete="name" required></label>
                <label>Correo electrónico <input type="email" name="correo" maxlength="150" autocomplete="username" required></label>
                <label>Contraseña <input type="password" name="contrasena" minlength="12" maxlength="128" autocomplete="new-password" required></label>
                <button>Crear administrador</button>
                <output id="folio-admin"></output>
            </form>
            <div id="lista-administradores" class="lista-institucional"></div>
        </details>

        <details class="panel-institucional" open>
            <summary>Solicitudes de acceso de autoridades</summary>
            <div id="solicitudes-autoridad" class="lista-institucional"></div>
        </details>

        <details class="panel-institucional">
            <summary>Instituciones para canalización</summary>
            <div id="instituciones-canalizacion"></div>
            <form class="formulario-institucional" id="nueva-institucion">
                <label>Nombre de la institución <input name="nombre" maxlength="150" required></label>
                <label>Correo oficial <input type="email" name="correo" maxlength="150" required></label>
                <label>Dirección <input name="direccion" maxlength="255"></label>
                <label>Teléfono <input type="tel" name="telefono" maxlength="20"></label>
                <button>Registrar institución</button>
            </form>
        </details>

        <section class="panel-institucional">
            <h2>Reportes de autoridades</h2>
            <label>Buscar por folio de reporte o canalización <input type="search" id="filtro-canalizacion"></label>
            <div id="lista-canalizaciones" class="lista-institucional"></div>
        </section>
    </main>
</body>
</html>
