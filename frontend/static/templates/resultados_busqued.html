<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/catalogo_instituciones.js" defer></script>
    <script src="../js/resultados_busqued.js" defer></script>
    <link rel="stylesheet" href="../css/paginas.css">
    <link rel="stylesheet" href="../css/resultados.css">
</head>
<body class="pagina-resultados pagina-app">
    <script src="../js/navbar.js"></script>

    <main class="contenido-pagina">

    <main class="contenido-pagina">

        <p class="ruta"><a href="principal.html">Inicio</a> › <a href="directorio.html">Directorio</a> › Resultados de búsqueda</p>

        <section class="hero">
            <h1>Resultados de búsqueda</h1>
            <p id="textoBusqueda">Instituciones disponibles</p>
        </section>

        <form class="tarjeta buscador-tarjeta" id="formularioResultados">
            <label for="nuevaBusqueda">Buscar institución o servicio</label>
            <div class="campo-busqueda">
                <input
                    type="search"
                    name="q"
                    id="nuevaBusqueda"
                    placeholder="Buscar otra institución o servicio..."
                >
                <button class="boton" type="submit">Buscar</button>
            </div>
        </form>

        <p class="cantidad" id="cantidadResultados"></p>

        <section class="lista-resultados" id="listaResultados"></section>

        <div class="tarjeta mensaje" id="mensajeSinResultados" hidden>
            <h2>No se encontraron resultados</h2>
            <p>Intenta buscar con otro nombre, ubicación o tipo de atención.</p>
        </div>

    </main>

    <script>
        const respaldo = "data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%27-4 -4 32 32%27 fill=%27none%27 stroke=%27%23c56ed3%27 stroke-width=%271.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 21h18M5 21V7l7-4 7 4v14M9 9h2M13 9h2M9 13h2M13 13h2M10 21v-4h4v4%27/%3E%3C/svg%3E";
        const lista = document.getElementById('listaResultados');
        function agregarImagenes() {
            lista.querySelectorAll('.tarjeta-resultado:not([data-imagen])').forEach(function (tarjeta) {
                tarjeta.dataset.imagen = '1';
                const enlace = tarjeta.querySelector('.boton-ver');
                const id = enlace ? new URL(enlace.href, location.href).searchParams.get('id') : null;
                if (!id) return;
                const caja = document.createElement('div');
                caja.className = 'imagen-resultado';
                const img = document.createElement('img');
                img.alt = 'Imagen de la institución';
                img.onerror = function () { img.onerror = null; img.src = respaldo; };
                img.src = '../img/' + id + '.png';
                caja.appendChild(img);
                tarjeta.insertBefore(caja, tarjeta.firstChild);
            });
        }
        new MutationObserver(agregarImagenes).observe(lista, { childList: true });
        agregarImagenes();
    </script>

</body>
</html>
