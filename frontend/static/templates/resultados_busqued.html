<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/catalogo_instituciones.js" defer></script>
    <script src="../js/resultados_busqued.js" defer></script>
    <style>
        .ruta { margin: 0; color: #923b61; font-size: 13px; font-weight: 600; }
        .buscador { width: 100%; padding: 24px; box-sizing: border-box; text-align: left; }
        .campo-busqueda { display: flex; gap: 10px; margin-top: 0; }
        .campo-busqueda .boton-cuenta { margin: 0; padding: 0 26px; border: 0; font: inherit; font-weight: 700; cursor: pointer; }
        .cantidad { margin: 0; color: #923b61; font-weight: 700; }
        .lista-resultados { display: grid; gap: 15px; }
        .tarjeta-resultado { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 24px; border: 1px solid #efb3e5; border-radius: 16px; background: linear-gradient(145deg, #fffaff, #f7d9f3); box-shadow: 0 8px 18px rgba(146, 59, 97, .14); }
        .imagen-resultado { display: flex; flex: 0 0 auto; width: 120px; height: 120px; align-items: center; justify-content: center; overflow: hidden; border-radius: 14px; background: linear-gradient(145deg, #f7d0f1, #ffffff); }
        .imagen-resultado img { width: 100%; height: 100%; object-fit: contain; }
        .informacion { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .informacion h2 { margin: 0 0 6px; color: #923b61; font-size: 18px; }
        .informacion p { margin: 0 0 8px; color: #6e5a70; font-size: 13px; line-height: 1.45; }
        .etiqueta { display: inline-block; margin: 3px 2px; padding: 5px 10px; border: 1px solid #d5b6dd; border-radius: 15px; background: #ffffff; color: #702283; font-size: 11px; font-weight: 600; }
        .boton-ver { padding: 12px 20px; border-radius: 9px; background: linear-gradient(135deg, #702283, #923b61); color: #ffffff; font-weight: 700; text-decoration: none; white-space: nowrap; }
        .mensaje { width: 100%; box-sizing: border-box; }
        .mensaje h2 { margin-top: 0; color: #923b61; }
        @media (max-width: 850px) {
            .contenido-inicio { width: 100%; padding: 32px 20px; gap: 28px; }
        }
        @media (max-width: 600px) {
            .contenido-inicio { padding: 24px 14px; gap: 22px; }
            .bloque-cta { padding: 22px 20px; }
            .titulo-inicio { font-size: 24px; }
            .descripcion-inicio { font-size: 15px; }
            .buscador { padding: 18px; }
            .boton-ver { width: 100%; box-sizing: border-box; text-align: center; }
            .campo-busqueda { flex-direction: column; }
            .campo-busqueda .boton-cuenta { padding: 13px; }
            .tarjeta-resultado { flex-direction: column; align-items: flex-start; }
            .imagen-resultado { width: 100%; height: 150px; }
        }
        @media (max-width: 420px) {
            .logo-centro span { display: none; }
        }
    </style>
</head>

<body class="pagina-inicio">

    <header class="barra-superior">
        <input type="checkbox" id="menu-toggle" class="toggle-menu" aria-label="Menú principal">
        <label for="menu-toggle" class="btn-hamburguesa">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav class="menu-lateral" aria-label="Navegación principal">
            <a href="principal.html">Inicio</a>
            <a href="descubre_mas.html">Descubre más</a>
            <a href="videos.html">Videos</a>
            <a href="directorio.html">Directorio</a>
            <a href="sobre_nosotros.html">Sobre nosotros</a>
        </nav>

        <div class="logo-centro">
            <img src="../img/centinela_digital.png" alt="Logo Centinela Digital">
            <span>CENTINELA DIGITAL</span>
        </div>

        <div class="iconos-derecha accesos-navbar">
            <a href="formulario.html">Consultar folio</a>
            <a href="cuenta.html">Mi cuenta</a>
        </div>
    </header>

    <main class="contenido-inicio">

        <p class="ruta">Inicio › Directorio › Resultados de búsqueda</p>

        <section class="bloque-cta">
            <div>
                <h1 class="titulo-inicio">Resultados de búsqueda</h1>
                <p class="descripcion-inicio" id="textoBusqueda">Instituciones disponibles</p>
            </div>
        </section>

        <form class="cuenta-panel buscador" id="formularioResultados">
            <div class="form-cuenta campo-busqueda">
                <input
                    type="search"
                    name="q"
                    id="nuevaBusqueda"
                    placeholder="Buscar otra institución o servicio..."
                >
                <button class="boton-cuenta" type="submit">Buscar</button>
            </div>
        </form>

        <p class="cantidad" id="cantidadResultados"></p>

        <section class="lista-resultados" id="listaResultados"></section>

        <div class="cuenta-panel mensaje" id="mensajeSinResultados" hidden>
            <h2>No se encontraron resultados</h2>
            <p>Intenta buscar con otro nombre, ubicación o tipo de atención.</p>
        </div>

    </main>

    <script>
        const respaldo = "data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%27-4 -4 32 32%27 fill=%27none%27 stroke=%27%23c56ed3%27 stroke-width=%271.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 21h18M5 21V7l7-4 7 4v14M9 9h2M13 9h2M9 13h2M13 13h2M10 21v-4h4v4%27/%3E%3C/svg%3E";
        const lista = document.getElementById('listaResultados');
        function agregarImagenes() {
            lista.querySelectorAll('.tarjeta-resultado:not([data-imagen])').forEach(function (tarjeta) {
                tarjeta.dataset.imagen = '1';
                const enlace = tarjeta.querySelector('.boton-ver');
                const id = enlace ? new URL(enlace.href, location.href).searchParams.get('id') : null;
                if (!id) return;
                const caja = document.createElement('div');
                caja.className = 'imagen-resultado';
                const img = document.createElement('img');
                img.alt = 'Imagen de la institución';
                img.onerror = function () { img.onerror = null; img.src = respaldo; };
                img.src = '../img/' + id + '.png';
                caja.appendChild(img);
                tarjeta.insertBefore(caja, tarjeta.firstChild);
            });
        }
        new MutationObserver(agregarImagenes).observe(lista, { childList: true });
        agregarImagenes();
    </script>

</body>
</html>
