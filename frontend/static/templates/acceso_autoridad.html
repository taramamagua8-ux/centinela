<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso de autoridad | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/institucional.css">
    <script src="../js/institucional.js" defer></script>
</head>
<body class="pagina-institucional pagina-acceso" data-pagina="acceso_autoridad">

    <div class="barra-volver">
        <a href="principal.html" class="btn-volver">← Volver</a>
    </div>

    <main class="institucional">
        <img class="logo-acceso" src="../img/centinela_Completo.png" alt="Centinela Digital">
        <h1>Acceso de autoridad</h1>
        <p class="subtitulo-acceso">Ingresa con tu correo y contraseña institucionales.</p>
        <p id="aviso-institucional" role="status" aria-live="polite"></p>
        <form id="acceso" class="panel-institucional formulario-institucional">
            <label>Correo electrónico <input type="email" name="correo" maxlength="150" autocomplete="username" required></label>
            <label>Contraseña <input type="password" name="contrasena" autocomplete="current-password" required></label>
            <button>Iniciar sesión</button>
            <a href="registro_autoridad.html">Solicitar una cuenta de autoridad</a>
        </form>
    </main>
</body>
</html>
