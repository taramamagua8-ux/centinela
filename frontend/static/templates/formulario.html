<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Consulta tu reporte | Centinela Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="pagina-folio">
    <main class="pagina-seguimiento">
        <header class="encabezado-seguimiento">
            <a class="btn-volver" href="principal.html">← Inicio</a>
            <h1 class="titulo-seguimiento">Consulta tu reporte</h1>
        </header>
        <section class="tarjeta-seguimiento">
            <div class="marca-folio">
                <img src="../img/Copia de LEO.jpg" alt="Centinela Digital" class="logo-seguimiento">
            </div>
            <form id="form-folio">
                <label for="folio" class="etiqueta-folio">Ingresa tu folio de seguimiento</label>
                <p id="ayuda-consulta" class="ayuda-folio">Usa el código que recibiste al enviar tu reporte.</p>
                <div class="recuadro-folio">
                    <input type="text" id="folio" name="folio" class="campo-folio"
                           aria-describedby="ayuda-consulta" placeholder="Ej. CD-2026-000123"
                           autocomplete="off" spellcheck="false" maxlength="64" required>
                </div>
                <div class="botones-seguimiento">
                    <a class="btn-secundario" href="formulario_reporte.html">No tengo folio</a>
                    <button type="submit" class="btn-principal">Consultar folio <span aria-hidden="true">→</span></button>
                </div>
            </form>
        </section>
    </main>
    <script src="../js/seguimiento.js?v=2"></script>
</body>
</html>
